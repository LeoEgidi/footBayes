# Builds the Quarto website in website/ and publishes it on GitHub Pages
# (https://leoegidi.github.io/footBayes/). The reference pages and the
# changelog are generated from man/*.Rd and NEWS.md by website/_prerender.R,
# so the site is rebuilt when these files change too.
# Requires Settings > Pages > Build and deployment > Source: "GitHub Actions".
on:
  push:
    branches: [main, master]
    paths:
      - "website/**"
      - "man/**"
      - "NEWS.md"
      - "NAMESPACE"
      - ".github/workflows/website.yaml"
  workflow_dispatch:

name: website.yaml

permissions: read-all

concurrency:
  group: website
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Used only by the pre-render script: no R packages are needed
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render website
        run: quarto render website

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
